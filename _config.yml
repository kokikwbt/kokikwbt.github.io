title: Koki Kawabata
name: Koki Kawabata
first_name: Koki
middle_name:
last_name: Kawabata
title_separator: "|"
locale: en-US
lang: en
timezone: Asia/Tokyo
url: https://kokikwbt.github.io
baseurl: ""
repository: kokikwbt/kokikwbt.github.io
description: "Koki Kawabata — data mining, tensor decomposition, anomaly detection, data streams, and time-series analysis."
keywords: data mining, tensor decomposition, anomaly detection, data streams, time series

remote_theme: academicpages/academicpages.github.io@8c57e1ae5da379512eb11165257fba02664b8531
ignore_theme_config: true
site_theme: default

author:
  name: Koki Kawabata
  avatar:
  bio: Assistant Professor
  location: Osaka, Japan
  employer: SANKEN, The University of Osaka
  uri: https://rd.iai.osaka-u.ac.jp/ja/741f1b08cc6f3c12.html
  contact: /about.html#contact
  googlescholar: https://scholar.google.com/citations?view_op=search_authors&mauthors=Koki+Kawabata
  github: kokikwbt
  orcid: https://orcid.org/0000-0003-4202-4513
  researchmap: https://researchmap.jp/koki-kawabata
  dblp: https://dblp.org/pid/219/8132
  twitter: kokikwbt
  linkedin: kokikwbt

# These keys match papers.bib; YAML order defines the section order.
publication_category:
  international:
    title: Conference Papers
  domestic:
    title: Journal Articles
  student:
    title: Student Workshop Papers

breadcrumbs: false
read_more: disabled
words_per_minute: 160
future: true
atom_feed:
  hide: true
comments:
  provider: false
analytics:
  provider: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

plugins:
  - jekyll-remote-theme
  - jekyll/scholar
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      share: false
      comments: false
      related: false
  - scope:
      path: publications.md
      type: pages
    values:
      layout: archive
      author_profile: true

scholar:
  last_name: [Kawabata, 川畑]
  first_name: [Koki, K., 光希]
  style: apa
  locale: en
  source: .
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  sort_by: source_order
  order: ascending
  group_by: none

filtered_bibtex_keywords:
  - abbr
  - additional_info
  - bibtex_show
  - html
  - selected
  - source_author_display
  - source_order
  - language
  - category

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.academicpages
  - LICENSE.al-folio
  - papers.bib
  - .bundle
  - .ruby-version
  - vendor
  - scripts
  - node_modules
  - package.json
  - package-lock.json
  - "*.qmd"
  - _quarto.yml
  - styles
