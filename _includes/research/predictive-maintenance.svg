<svg class="research-diagram research-diagram--maintenance" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" fill="none" role="img" aria-labelledby="research-maintenance-title research-maintenance-desc">
  <title id="research-maintenance-title">Predictive maintenance</title>
