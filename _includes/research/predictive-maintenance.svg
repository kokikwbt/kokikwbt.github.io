    <circle cx="73" cy="119" r="3" fill="var(--research-teal, #087c7e)"/>
    <path d="M108 134H332" stroke="var(--research-grid, #bdc8d3)" stroke-width="1.7"/>
    <rect x="287" y="39" width="28" height="95" rx="14" fill="var(--research-coral-soft, #f5d9d4)" opacity=".65"/>
